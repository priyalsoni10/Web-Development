<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Developmeent</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: sans-serif;
        }

        .loginModel{
            width:30%;
            height:100vh;
            position:fixed;
            transition: 0.5s;;
            padding:40px;
            top:0px;
            right: -500px;
            background-color:#ccc;
        }
        .loginModel span{
            font-size:30px;
            cursor: pointer;
        }
        .headingModel{
            display: flex;
            margin-top: 100px;
            justify-content: space-between;
            
        }   
        .headingModel h3{
            font-size: 20px;
            
        }
        .loginModel form{
            margin-top: 40px;
        }
        .loginModel form label{
            display:block;
        }
        .loginModel form input{
            width:100%;
            height:40px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .loginModel form button{
            width:100%;
            padding: 10px 0px;
            margin-top: 30px;
            border-radius: 5px;
            background-color: teal;
            color:#fff;
            font-size: 20px;
            border:none;
            cursor: pointer;
        }
        .loginModel form p{
            margin-top: 20px;
            text-align: center;
        }
        .showLoginModel{
            right:0px;
           
        }
    </style>
</head>
<body>
    <button id="login"> Login </button>
    <div class="loginModel">
        <span>&times;</span> <!--- Close symbol button le aaega--->
        <div class="headingModel">
            <h3> Login </h3>
            <p> Use email , instead </p>
        </div>
            <form action="">
                <label for=""> Mobile Number </label>
                <input type="text" placeholder=" Enter Mobile Number ">
                <button> Login </button>
                <p>Don't have an account?<a href="#"> Create an account </a></p>
            </form>
      
    </div>

</body>
<script>
    let loginBtn = document.querySelector('#login');
    let loginModelElement = document.querySelector('.loginModel');
    let closeBtn = document.querySelector('.loginModel span');
    loginBtn.addEventListener("click", () => {
        loginModelElement.classList.add('showLoginModel');
    });
</script>
</html>
