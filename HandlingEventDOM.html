<!-- Handling Events in the DOM
Events are actions that occur in the browser, such as clicking a button, hovering over an element, or submitting a form. JavaScript can respond to these events by executing code when they occur.

Event Listeners
To handle events in the DOM, developers use event listeners. An event listener is a function that waits for a specific event to occur and then executes code when that event happens.

There are several ways to add event listeners:
1. Using the onclick property of an element.
2. Using the addEventListener() method.

ClassList Object
The classList object is a property of DOM elements that provides methods to manipulate the classes of an element. It allows developers to add, remove, and toggle classes easily.

Example:
<button id="myButton">Click me</button>

<script>
    let button = document.getElementById("myButton");
    button.onclick = function() {
        alert("Button clicked!");
    };
</script>
-->
