<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development</title>
</head>
<body>
    <input type="password" placeholder="Enter the password..."/>
    <button> Show</button>
    
</body>
<script>
    let btn = document.querySelector("button");
    let inputElement = document.querySelector("input");
    btn.addEventListener("click", ()=>{
        // console.log(inputElement.type); // prints the type of the input element -> password
       if(btn.innerText =="Show"){
        inputElement.type = "text"; // changes the type of the input element to text to show the password
        btn.innerHTML = "hide"; // changes the button html  to Hide       
        }
        else{
            inputElement.type = "password"; // changes the type of the input element to password to hide the password
            btn.innerHTML = "Show"; // changes the button html to Show
        }
    });
</script>
</html>
